<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Modo Concentracion</title>

        <link rel="stylesheet" href="popup.css">
    </head>

    <body>
        <div class="container">
            <h1>YouTube</h1>

            <div class="option">
                <div>
                    <h2>Ocultar YouTube Shorts</h2>
                    <p>Oculta los Shorts para reducir distracciones</p>
                </div>

                <label class="switch">
                    <input type="checkbox" id="shortsToggle">
                    <span class="slider"></span>
                </label>
            </div>
        </div>
        <div class="container">
            <h1>Instagram</h1>

            <div class="option">
                <div>
                    <h2>Ocultar Reels</h2>
                    <p>Oculta los reels para reducir distracciones</p>
                </div>

                <label class="switch">
                    <input type="checkbox" id="reelsToggle">
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <script src="popup.js"></script>
    </body>
</html>
